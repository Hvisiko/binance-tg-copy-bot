name: Keep Render Free Instance Awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Health Endpoint
        env:
          RENDER_URL: ${{ vars.RENDER_EXTERNAL_URL }}
        run: |
          if [ -n "$RENDER_URL" ]; then
            curl -fsS --max-time 15 "${RENDER_URL%/}/healthz"
          else
            echo "RENDER_EXTERNAL_URL variable not set yet; skipping."
          fi
